name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Tests and quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deployment:
    name: Production container images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate production Docker Compose configuration
        run: docker compose --env-file .env.production.example -f compose.production.yml config --quiet

      - name: Build backend image
        run: docker build --file docker/backend.Dockerfile --tag rus-map-backend:ci .

      - name: Verify backend runs as a non-root user
        run: test "$(docker run --rm rus-map-backend:ci id -u)" = "10001"

      - name: Build frontend image
        run: docker build --file docker/frontend.Dockerfile --tag rus-map-frontend:ci .
